name: tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:   # deploy-cloud.yml runs these before building

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run contract tests
        run: python3 -m pytest tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (includes the no-three.js-in-src/sim rule)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
